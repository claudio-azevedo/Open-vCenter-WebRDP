<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WebRDP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Connection Form -->
    <div id="connection-form" class="form-container">
        <h1>WebRDP</h1>
        <p class="subtitle">Remote Desktop via Browser</p>

        <form id="rdp-form" onsubmit="return connectRDP();" autocomplete="off">
            <!-- Connection Type -->
            <div class="form-group" id="group-conn-type">
                <label for="conn-type">Connection Type</label>
                <select id="conn-type" onchange="toggleConnectionType()">
                    <option value="rdp">Standard RDP</option>
                    <option value="hyperv">HyperV Console (vmconnect)</option>
                </select>
            </div>

            <!-- Host -->
            <div class="form-group" id="group-hostname">
                <label for="hostname">Host / IP</label>
                <input type="text" id="hostname" placeholder="192.168.1.100" required>
            </div>

            <!-- Port -->
            <div class="form-group" id="group-port">
                <label for="port">Port</label>
                <input type="number" id="port" value="3389" min="1" max="65535">
            </div>

            <!-- VM GUID (HyperV only) -->
            <div class="form-group" id="vm-guid-group" style="display:none;">
                <label for="vm-guid">VM GUID (preconnection-blob)</label>
                <input type="text" id="vm-guid" placeholder="b747349c-c90b-4126-bc2d-ef8ceb3444c4">
            </div>

            <!-- Username -->
            <div class="form-group" id="group-username">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="administrator" autocomplete="off">
            </div>

            <!-- Password -->
            <div class="form-group" id="group-password">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="new-password">
            </div>

            <!-- Domain (optional) -->
            <div class="form-group" id="group-domain">
                <label for="domain">Domain (optional)</label>
                <input type="text" id="domain" placeholder="MYDOMAIN">
            </div>

            <!-- Security -->
            <div class="form-group" id="group-security">
                <label for="security">Security</label>
                <select id="security">
                    <option value="nla">NLA (Network Level Authentication)</option>
                    <option value="tls">TLS</option>
                    <option value="rdp">RDP</option>
                    <option value="any">Any</option>
                </select>
            </div>

            <button type="submit" class="btn-connect">Connect</button>
        </form>
    </div>

    <!-- Remote Desktop Display -->
    <div id="rdp-container" style="display:none;">
        <div id="toolbar">
            <button id="btn-disconnect" onclick="disconnectRDP()">Disconnect</button>
            <button id="btn-reconnect" onclick="reconnectRDP()">Reconnect</button>
            <button id="btn-clipboard" onclick="toggleClipboard()">Clipboard</button>
            <button id="btn-ctrl-alt-del" onclick="sendCtrlAltDel()">Ctrl+Alt+Del</button>
            <span id="status-text"></span>
        </div>
        <div id="clipboard-panel" style="display:none;">
            <textarea id="clipboard-text" placeholder="Paste text here to send to remote, or copy from remote..."></textarea>
            <button id="btn-type-clipboard" onclick="typeClipboardText()">Type clipboard text</button>
        </div>
        <div id="display"></div>
    </div>

    <!-- Guacamole JS API -->
    <script type="text/javascript" src="guacamole-common-js/all.min.js"></script>

    <!-- App logic -->
    <script type="text/javascript" src="app.js"></script>

    <!-- Auto-focus for iframe embedding -->
    <script type="text/javascript">
        // Capture keyboard when embedded in the ovc-frontend iframe: take focus on
        // an explicit click only (grabbing it on mouseover steals focus from the
        // parent page while the pointer merely passes over the console).
        window.addEventListener('click', function() { window.focus(); });
    </script>

</body>
</html>
