---
apiVersion: v1
kind: Service
metadata:
  name: ovc-webrdp-service-nodeport
  namespace: ovc
spec:
  selector:
    app: ovc-webrdp-service-nodeport
  ports:
    - protocol: TCP
      port: 30080
      targetPort: 8080
      name: http
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovc-webrdp-service-nodeport
  namespace: ovc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ovc-webrdp-service-nodeport
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ovc-webrdp-service-nodeport
    spec:
      volumes:
        - name: guacd-home
          emptyDir: {}
      containers:
        # Container 1: guacd (Guacamole proxy daemon)
        - name: guacd
          image: guacamole/guacd:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GUACD_LOG_LEVEL
              value: debug
          ports:
            - containerPort: 4822
              name: guacd
              protocol: TCP
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          volumeMounts:
            - name: guacd-home
              mountPath: /home/guacd

        # Container 2: webrdp (Tomcat web app)
        - name: webrdp
          image: ghcr.io/claudio-azevedo/ovc-webrdp:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GUACD_HOSTNAME
              value: "localhost"
            - name: GUACD_PORT
              value: "4822"
            - name: WEBAPP_CONTEXT
              value: "webrdp"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          readinessProbe:
            httpGet:
              path: /webrdp/
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /webrdp/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      restartPolicy: Always
---
